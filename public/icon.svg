<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer scanning frame corners -->
  <path d="M 120 170 L 120 130 A 20 20 0 0 1 140 110 L 180 110" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <path d="M 332 110 L 372 110 A 20 20 0 0 1 392 130 L 392 170" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <path d="M 392 342 L 392 382 A 20 20 0 0 1 372 402 L 332 402" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <path d="M 180 402 L 140 402 A 20 20 0 0 1 120 382 L 120 342" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

  <!-- Laser scanning beam -->
  <line x1="100" y1="256" x2="412" y2="256" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.95" />
  <circle cx="256" cy="256" r="6" fill="#38bdf8" />

  <!-- Isometric Warehouse Box / Barcode motif -->
  <!-- Top Face -->
  <polygon points="256,160 330,200 256,240 182,200" fill="#6366f1" opacity="0.95" />
  <!-- Left Face -->
  <polygon points="182,200 256,240 256,330 182,290" fill="#4338ca" />
  <!-- Right Face with Barcode Bars -->
  <polygon points="256,240 330,200 330,290 256,330" fill="#3730a3" />

  <!-- Barcode pattern on top box -->
  <line x1="274" y1="240" x2="274" y2="310" stroke="#a5b4fc" stroke-width="4" />
  <line x1="284" y1="234" x2="284" y2="304" stroke="#a5b4fc" stroke-width="2" />
  <line x1="294" y1="228" x2="294" y2="298" stroke="#a5b4fc" stroke-width="6" />
  <line x1="306" y1="222" x2="306" y2="292" stroke="#a5b4fc" stroke-width="3" />
  <line x1="316" y1="216" x2="316" y2="286" stroke="#a5b4fc" stroke-width="5" />

  <!-- Text KAF -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="4" fill="#f8fafc" text-anchor="middle">INVENTA KAF</text>
</svg>
